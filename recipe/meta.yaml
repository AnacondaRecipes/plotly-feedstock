# E   ModuleNotFoundError: No module named 'pdfrw'
# E   RecursionError: maximum recursion depth exceeded while calling a Python object
# Numpy>=2 is not supported by some tests
# E   AttributeError: module 'numpy' has no attribute 'in1d'. Did you mean: 'int16'?
# E   TypeError: percentile() got an unexpected keyword argument 'interpolation'
# plotly's in_values() does `if in_values:` where in_values is result of `e == v` on ndarray
# E   ValueError: Invalid value of type 'numpy.ndarray' received for the 'prop' property
# E   AssertionError: (assert np is not None) in copy_to_readonly_numpy_array()
# E   RecursionError: maximum recursion depth exceeded
# >   assert pio.renderers.default == "browser"
# E   AssertionError: assert '' == 'browser'
# Polars 3.14 is not available. E ModuleNotFoundError: No module named 'polars'
# E   pyarrow.lib.ArrowInvalid: Cannot locate timezone 'CET': Timezone database not found at "C:\Users\task_176408304616546\Downloads\tzdata"
package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/{{ name }}/{{ name }}.py/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 96b704c8af359fbfb9c5b4502587822d6ac0b527a6378c1550a0e9c13fb2ee72

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  entry_points:
    - plotly_get_chrome = plotly.io._kaleido:plotly_get_chrome
  skip: true  # [py<38]

requirements:
  host:
    - pip
    - python
    - hatchling >=1.26
  run:
    - python
    - packaging
    - narwhals >=1.15.1
  run_constrained:
    # Upstream's `kaleido` extra (plotly 6.7.0 pyproject.toml) pins
    # `kaleido>=1.1.0`. python-kaleido 1.3.0 now ships on pkgs/main, so match
    # upstream's semantic — plotly's chrome-based image-export path requires
    # the kaleido-1.x API (`plotly_get_chrome`, `kaleido.Kaleido`).
    - python-kaleido >=1.3.0
    - numpy >=1.22

test:
  source_files:
    - tests
  imports:
    - plotly
    - plotly.offline
    - plotly.io
    - plotly.matplotlylib
    - plotly.matplotlylib.mplexporter
    - plotly.matplotlylib.mplexporter.renderers
    - plotly.figure_factory
    - plotly.data
    - plotly.colors
    - plotly.express
    - plotly.express.data
    - plotly.express.colors
    - plotly.express.trendline_functions
    - plotly.graph_objects
    - plotly.graph_objs
    - plotly.graph_objs.bar
    - plotly.graph_objs.barpolar
    - plotly.graph_objs.box
    - plotly.graph_objs.candlestick
    - plotly.graph_objs.carpet
    - plotly.graph_objs.choropleth
    - plotly.graph_objs.choroplethmap
    - plotly.graph_objs.choroplethmapbox
    - plotly.graph_objs.cone
    - plotly.graph_objs.contour
    - plotly.graph_objs.contourcarpet
    - plotly.graph_objs.densitymap
    - plotly.graph_objs.densitymapbox
    - plotly.graph_objs.funnel
    - plotly.graph_objs.funnelarea
    - plotly.graph_objs.heatmap
    - plotly.graph_objs.histogram
    - plotly.graph_objs.histogram2d
    - plotly.graph_objs.histogram2dcontour
    - plotly.graph_objs.icicle
    - plotly.graph_objs.image
    - plotly.graph_objs.indicator
    - plotly.graph_objs.isosurface
    - plotly.graph_objs.layout
    - plotly.graph_objs.mesh3d
    - plotly.graph_objs.ohlc
    - plotly.graph_objs.parcats
    - plotly.graph_objs.parcoords
    - plotly.graph_objs.pie
    - plotly.graph_objs.sankey
    - plotly.graph_objs.scatter
    - plotly.graph_objs.scatter3d
    - plotly.graph_objs.scattercarpet
    - plotly.graph_objs.scattergeo
    - plotly.graph_objs.scattergl
    - plotly.graph_objs.scattermap
    - plotly.graph_objs.scattermapbox
    - plotly.graph_objs.scatterpolar
    - plotly.graph_objs.scatterpolargl
    - plotly.graph_objs.scattersmith
    - plotly.graph_objs.scatterternary
    - plotly.graph_objs.splom
    - plotly.graph_objs.streamtube
    - plotly.graph_objs.sunburst
    - plotly.graph_objs.surface
    - plotly.graph_objs.table
    - plotly.graph_objs.treemap
    - plotly.graph_objs.violin
    - plotly.graph_objs.volume
    - plotly.graph_objs.waterfall
    - plotly.package_data
    - plotly.package_data.datasets
    - plotly.package_data.templates
    - plotly.validators
  commands:
    - pip check
    # plotly_get_chrome is unusable with `--help` because upstream's CLI does
    # manual sys.argv parsing (plotly/io/_kaleido.py L795-847) and treats
    # `--help` as an unrecognized argument — prints usage then `sys.exit(1)`.
    # The `--help` line in its own usage text is documentation, not a real
    # handler. Verify the entry point is reachable via Python instead.
    - python -c "from plotly.io._kaleido import plotly_get_chrome; assert callable(plotly_get_chrome)"
    - pytest tests {{ ignore_tests }} {{ deselect_tests }}
  requires:
    - pip
    - numpy
    - matplotlib-base
    - pandas <3
    - pytest
    - xarray
    - polars  # [py<314]
    - scipy
    - requests
    - pyarrow
    - statsmodels
    - ipython
    - anywidget
    - nbformat >=4.2.0
    - scikit-image
    - pytz
    # Needed for plotly_get_chrome --help (kaleido_major() >= 1 check)
    - python-kaleido >=1.1.0

about:
  home: https://plotly.com/python
  license: MIT
  license_family: MIT
  license_file: LICENSE.txt
  summary: An open-source interactive data visualization library for Python
  description: |
    plotly.py is an interactive, open-source, and browser-based graphing
    library for Python. Built on top of plotly.js, plotly.py is a high-level,
    declarative charting library. plotly.js ships with over 30 chart types,
    including scientific charts, 3D graphs, statistical charts, SVG maps,
    financial charts, and more.
  doc_url: https://plotly.com/python
  dev_url: https://github.com/plotly/plotly.py

extra:
  recipe-maintainers:
    - chohner
    - moorepants
    - ocefpaf
